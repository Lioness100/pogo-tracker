<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raid Alert</title>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Nunito+Sans:wght@600;700;800;900&display=swap');

      :root {
        --blue: #00a8e8;
        --blue-dark: #0076a8;
        --green: #68b957;
        --green-dark: #4d9b45;
        --dark: #20272b;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: 'Nunito Sans', sans-serif;
        color: var(--dark);
        background: url('https://lh3.googleusercontent.com/PWSt8OX5qG416x9n9SAfktLM_n_CbEVCSo9_V4OKdnaOlN_veHLikyOEHqlDOAZqHwFsrAdMXH_dOzyf8l-jsX_5pQq1hR4DEQ=s0-e365')
          center center / cover no-repeat fixed;
      }

      .page {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .card {
        width: min(940px, 100%);
        max-height: calc(100vh - 48px);
        display: grid;
        grid-template-columns: 0.85fr 1.15fr;
        background: white;
        border-radius: 26px;
        overflow: hidden;
        box-shadow:
          0 18px 50px rgba(28, 77, 62, 0.24),
          0 4px 0 rgba(255, 255, 255, 0.7);
      }

      .intro {
        position: relative;
        overflow: hidden;
        min-height: 570px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 48px 30px;
        color: white;
        background:
          radial-gradient(
            circle at 50% 27%,
            rgba(255, 255, 255, 0.17) 0,
            rgba(255, 255, 255, 0) 34%
          ),
          linear-gradient(180deg, #19afe4 0%, #42c0e5 55%, #73c467 100%);
      }

      .intro::before,
      .intro::after {
        content: '';
        position: absolute;
        width: 145%;
        border-radius: 50% 50% 0 0;
      }

      .intro::before {
        height: 220px;
        left: -22%;
        bottom: -92px;
        background: #82ce70;
        transform: rotate(-3deg);
      }

      .intro::after {
        height: 170px;
        left: -20%;
        bottom: -118px;
        background: #55a94d;
        transform: rotate(4deg);
      }

      .intro-content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .egg {
        width: 174px;
        height: 174px;
        object-fit: contain;
        margin-bottom: 24px;
        filter: drop-shadow(0 14px 10px rgba(32, 80, 42, 0.28));
        animation: float 3.5s ease-in-out infinite;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-9px);
        }
      }

      .intro-label {
        margin-bottom: 7px;
        font-size: 11px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 2px;
        text-shadow: 0 2px 4px rgba(0, 70, 100, 0.2);
      }

      .intro-title {
        margin: 0;
        font-family: 'Barlow Condensed', sans-serif;
        font-size: clamp(60px, 7vw, 84px);
        font-weight: 800;
        line-height: 0.82;
        text-transform: uppercase;
        letter-spacing: -1px;
        text-shadow:
          0 4px 0 rgba(0, 92, 135, 0.25),
          0 8px 18px rgba(0, 80, 100, 0.18);
      }

      .intro-description {
        max-width: 285px;
        margin: 18px auto 0;
        font-size: 14px;
        font-weight: 800;
        line-height: 1.45;
        text-shadow: 0 2px 4px rgba(0, 70, 100, 0.18);
      }

      /* --------------------------------------------------
         RIGHT SIDE
      -------------------------------------------------- */

      .controls {
        padding: 38px 42px 34px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-width: 0;
      }

      .heading {
        margin-bottom: 20px;
      }

      .heading h2 {
        margin: 0;
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 43px;
        font-weight: 800;
        line-height: 0.9;
        text-transform: uppercase;
        letter-spacing: -0.5px;
      }

      .heading p {
        margin: 9px 0 0;
        color: #727c81;
        font-size: 13px;
        font-weight: 700;
        line-height: 1.45;
      }

      .coordinates {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      label {
        display: block;
        margin: 0 0 7px 3px;
        color: #69747a;
        font-size: 10px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      input {
        width: 100%;
        height: 47px;
        padding: 0 14px;
        border: 2px solid #dfe4e6;
        border-radius: 8px;
        background: #fafbfb;
        color: #263238;
        font-family: 'Nunito Sans', sans-serif;
        font-size: 14px;
        font-weight: 800;
        outline: none;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }

      input:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px rgba(0, 168, 232, 0.12);
      }

      .filters {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 12px;
        margin-top: 13px;
      }

      .filter-input {
        min-width: 0;
      }

      .filter-input input {
        height: 43px;
      }

      .input-suffix {
        position: relative;
      }

      .input-suffix input {
        padding-right: 42px;
      }

      .suffix {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        color: #8b969b;
        font-size: 10px;
        font-weight: 900;
        pointer-events: none;
        text-transform: uppercase;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 14px;
      }

      button {
        height: 47px;
        border: 0;
        border-radius: 8px;
        font-family: 'Nunito Sans', sans-serif;
        font-size: 11px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.3px;
        cursor: pointer;
        transition:
          transform 0.12s,
          filter 0.12s;
      }

      button:hover {
        transform: translateY(-2px);
        filter: brightness(1.04);
      }

      button:active {
        transform: translateY(1px);
      }

      button:disabled {
        opacity: 0.55;
        cursor: wait;
        transform: none;
      }

      .location-button {
        background: #eef8fc;
        color: var(--blue-dark);
        border: 2px solid #c6e7f3;
      }

      .check-button {
        background: var(--blue);
        color: white;
        box-shadow: 0 4px 0 #0076a5;
      }

      .result {
        display: none;
        margin-top: 16px;
        border: 1px solid #e0e5e7;
        border-radius: 9px;
        overflow: hidden;
        min-height: 0;
      }

      .result.visible {
        display: block;
      }

      .result-status {
        padding: 12px 16px;
        background: #fff1bf;
        color: #735d00;
      }

      .result-status.success {
        background: #e9f7e5;
        color: #47723d;
      }

      .result-status.error {
        background: #fae5e5;
        color: #8b4141;
      }

      .result-label {
        font-size: 9px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 1px;
        opacity: 0.7;
      }

      .result-message {
        margin-top: 3px;
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 25px;
        font-weight: 700;
        line-height: 1.05;
      }

      .eggs {
        padding: 9px;
        background: #f7f8f8;
        max-height: 185px;
        overflow-y: auto;
      }

      .eggs-empty {
        padding: 12px 7px;
        color: #7c878c;
        font-size: 11px;
        font-weight: 800;
        text-align: center;
      }

      .egg-card {
        display: grid;
        grid-template-columns: 52px 1fr auto;
        align-items: center;
        gap: 10px;
        padding: 8px 9px;
        margin-bottom: 6px;
        background: white;
        border: 1px solid #e2e6e7;
        border-radius: 7px;
      }

      .egg-card:last-child {
        margin-bottom: 0;
      }

      .egg-image {
        width: 52px;
        height: 52px;
        object-fit: contain;
      }

      .egg-info {
        min-width: 0;
      }

      .egg-location {
        color: #263238;
        font-size: 12px;
        font-weight: 900;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .egg-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 7px;
        margin-top: 3px;
        color: #7c878c;
        font-size: 9px;
        font-weight: 800;
      }

      .egg-rating {
        color: #735d00;
        font-weight: 900;
      }

      .shadow-badge {
        color: #654a78;
      }

      .egg-distance {
        white-space: nowrap;
      }

      .hatch-time {
        min-width: 60px;
        text-align: right;
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 19px;
        font-weight: 800;
        color: var(--blue-dark);
        line-height: 1;
      }

      .hatch-time.hatching {
        color: var(--green-dark);
      }

      @media (max-width: 720px) {
        html,
        body {
          overflow: auto;
        }
        .page {
          height: auto;
          min-height: 100vh;
          padding: 15px;
        }
        .card {
          max-height: none;
          grid-template-columns: 1fr;
        }
        .intro {
          min-height: 330px;
          padding: 35px 20px 30px;
        }
        .egg {
          width: 105px;
          height: 105px;
          margin-bottom: 15px;
        }
        .intro-title {
          font-size: 62px;
        }
        .intro-description {
          margin-top: 12px;
        }
        .controls {
          padding: 32px 24px;
        }
        .result {
          max-height: none;
        }
        .eggs {
          max-height: 300px;
        }
      }

      @media (max-width: 500px) {
        .filters,
        .coordinates,
        .actions {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 430px) {
        .egg-card {
          grid-template-columns: 45px 1fr auto;
        }
        .egg-image {
          width: 45px;
          height: 45px;
        }
      }
    </style>
  </head>

  <body>
    <main class="page">
      <div class="card">
        <section class="intro">
          <div class="intro-content">
            <img
              class="egg"
              src="https://storage.googleapis.com/pgorelease-assets/Campfire/RaidIcons/raid_egg_2_icon.png"
              alt="Raid Egg"
            />
            <div class="intro-label">Upcoming Raids Nearby</div>
            <h1 class="intro-title">Raid<br />Alert</h1>
            <p class="intro-description">
              See upcoming raid eggs, their locations, ratings, and hatch times.
            </p>
          </div>
        </section>

        <section class="controls">
          <div class="heading">
            <h2>Where are you?</h2>
            <p>
              Enter coordinates or let your browser find your location automatically.
            </p>
          </div>

          <div class="coordinates">
            <div>
              <label for="lat">Latitude</label>
              <input id="lat" step="any" placeholder="42.4184" />
            </div>
            <div>
              <label for="lng">Longitude</label>
              <input id="lng" step="any" placeholder="-71.1062" />
            </div>
          </div>

          <div class="filters">
            <div class="filter-input">
              <label for="withinMinutes">Hatch Window</label>
              <div class="input-suffix">
                <input id="withinMinutes" type="number" min="1" max="60" step="1" value="60" />
                <span class="suffix">min</span>
              </div>
            </div>
            <div class="filter-input">
              <label for="ratingThreshold">Min Rating</label>
              <div class="input-suffix">
                <input id="ratingThreshold" type="number" min="1" max="6" step="1" value="1" />
                <span class="suffix">star</span>
              </div>
            </div>
            <div class="filter-input">
              <label for="radius">Radius</label>
              <div class="input-suffix">
                <input id="radius" type="number" min="0" step="1" value="80" placeholder="80" />
                <span class="suffix">m</span>
              </div>
            </div>
          </div>

          <div class="actions">
            <button class="location-button" id="locate">📍 Use My Location</button>
            <button class="check-button" id="check">Check Nearby</button>
          </div>

          <div class="result" id="result">
            <div class="result-status" id="resultStatus">
              <div class="result-label">Raid Activity</div>
              <div class="result-message" id="resultMessage"></div>
            </div>
            <div class="eggs" id="eggs"></div>
          </div>
        </section>
      </div>
    </main>

    <script>
const lat = document.getElementById('lat');
      const lng = document.getElementById('lng');
      const withinMinutes = document.getElementById('withinMinutes');
      const ratingThreshold = document.getElementById('ratingThreshold');
      const radius = document.getElementById('radius');

      const locate = document.getElementById('locate');
      const check = document.getElementById('check');

      const result = document.getElementById('result');
      const resultStatus = document.getElementById('resultStatus');
      const resultMessage = document.getElementById('resultMessage');
      const eggsContainer = document.getElementById('eggs');

      if (localStorage.getItem('savedLat')) lat.value = localStorage.getItem('savedLat');
      if (localStorage.getItem('savedLng')) lng.value = localStorage.getItem('savedLng');

      lat.addEventListener('input', () => localStorage.setItem('savedLat', lat.value));
      lng.addEventListener('input', () => localStorage.setItem('savedLng', lng.value));

      let hatchTimer = null;
      let currentEggs = [];

      function showResult(message, type = '', eggs = []) {
        result.className = 'result visible';
        resultStatus.className = 'result-status ' + type;
        resultMessage.textContent = message;
        currentEggs = eggs;
        renderEggs();
      }

      function formatHatchTime(timestamp) {
        const remaining = timestamp - Date.now();
        if (remaining <= 0) return { text: 'HATCHING', hatching: true };

        const totalSeconds = Math.floor(remaining / 1000);
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;

        const text = hours > 0 ? `${hours}h ${String(minutes).padStart(2, '0')}m`
                   : minutes > 0 ? `${minutes}m ${String(seconds).padStart(2, '0')}s`
                   : `${seconds}s`;

        return { text, hatching: false };
      }

      function renderEggs() {
        if (!currentEggs.length) {
          eggsContainer.innerHTML = `<div class="eggs-empty">No qualifying raid eggs found nearby.</div>`;
          return;
        }

        eggsContainer.innerHTML = currentEggs.map((egg, index) => {
          const hatch = formatHatchTime(egg.start);
          const safeName = escapeHtml(egg.name);

          return `
            <div class="egg-card">
              <img class="egg-image" src="${egg.eggImageUrl}" alt="Raid Egg" />
              <div class="egg-info">
                <div class="egg-location" title="${safeName}">${safeName}</div>
                <div class="egg-meta">
                  <span class="egg-rating">${'★'.repeat(egg.rating)}</span>
                  <span class="egg-distance">${Math.round(egg.distance)} m</span>
                  ${egg.isShadow ? `<span class="shadow-badge">SHADOW</span>` : ''}
                </div>
              </div>
              <div class="hatch-time ${hatch.hatching ? 'hatching' : ''}" data-egg-index="${index}">
                ${hatch.text}
              </div>
            </div>
          `;
        }).join('');
      }

      function updateCountdowns() {
        document.querySelectorAll('.hatch-time').forEach((element) => {
          const egg = currentEggs[Number(element.dataset.eggIndex)];
          if (!egg) return;

          const hatch = formatHatchTime(egg.start);
          element.textContent = hatch.text;
          element.classList.toggle('hatching', hatch.hatching);
        });
      }

      function startCountdown() {
        if (hatchTimer) clearInterval(hatchTimer);
        hatchTimer = setInterval(updateCountdowns, 1000);
      }

      const escapeHtml = str => String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      })[m]);

      function getFilterValues() {
        const filters = {
          withinMinutes: Math.max(1, Math.min(60, Math.round(withinMinutes.value) || 60)),
          ratingThreshold: Math.max(1, Math.min(6, Math.round(ratingThreshold.value) || 1)),
          radius: Math.max(0, Number(radius.value) || 80)
        };
        withinMinutes.value = filters.withinMinutes;
        ratingThreshold.value = filters.ratingThreshold;
        radius.value = filters.radius;
        return filters;
      }

      locate.addEventListener('click', () => {
        if (!navigator.geolocation) return showResult('Location is not supported by this browser.', 'error');

        locate.disabled = true;
        locate.textContent = '📍 Finding Location…';

        const resetLocateBtn = () => {
          locate.disabled = false;
          locate.textContent = '📍 Use My Location';
        };

        navigator.geolocation.getCurrentPosition(
          (position) => {
            lat.value = position.coords.latitude.toFixed(6);
            lng.value = position.coords.longitude.toFixed(6);

            localStorage.setItem('savedLat', lat.value);
            localStorage.setItem('savedLng', lng.value);

            resetLocateBtn();
          },
          (error) => {
            resetLocateBtn();
            const msgs = { 1: 'Location permission was denied.', 2: 'Could not determine your location.' };
            showResult(msgs[error.code] || 'Location request timed out.', 'error');
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
        );
      });

      check.addEventListener('click', async () => {
        const latitude = Number(lat.value);
        const longitude = Number(lng.value);

        if (!lat.value || !lng.value || isNaN(latitude) || isNaN(longitude)) {
          return showResult('Enter a valid latitude and longitude.', 'error');
        }
        if (Math.abs(latitude) > 90) return showResult('Latitude must be between -90 and 90.', 'error');
        if (Math.abs(longitude) > 180) return showResult('Longitude must be between -180 and 180.', 'error');

        const filters = getFilterValues();
        check.disabled = locate.disabled = true;
        check.textContent = 'Searching…';

        try {
          const response = await fetch('/location', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ lat: latitude, lng: longitude, ...filters })
          });

          const data = await response.json();
          if (!response.ok) throw new Error(data.error || 'Something went wrong.');

          showResult(data.notification || 'No qualifying raid eggs found nearby.', data.notification ? '' : 'success', data.data);
          startCountdown();
        } catch (error) {
          showResult(error.message || 'Could not reach the API.', 'error');
        } finally {
          check.disabled = locate.disabled = false;
          check.textContent = 'Check Nearby';
        }
      });
    </script>
  </body>
</html>
